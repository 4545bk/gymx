<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(26, 31, 53, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(30, 41, 59, 1);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #cfbcff 0%, #a78bfa 100%);
        }
        .brand-gradient {
            background: linear-gradient(to right, #cfbcff, #e7c365);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
      </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md">
<!-- Decorative Radial Gradients -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-tertiary/10 blur-[120px] pointer-events-none"></div>
<main class="w-full max-w-[420px] px-margin-mobile md:px-0 z-10">
<!-- Login Card -->
<div class="glass-card rounded-[20px] p-8 shadow-[0_8px_30px_rgba(0,0,0,0.5)]">
<!-- Logo Area -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 rounded-xl primary-gradient flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(207,188,255,0.2)]">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="fitness_center">fitness_center</span>
</div>
<h1 class="font-display text-display brand-gradient">GymX</h1>
</div>
<!-- Heading -->
<div class="text-center mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Welcome back</h2>
<p class="font-body-md text-on-surface-variant">Elite Performance Management</p>
</div>
<!-- Form -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-[#1a1f35] border border-outline-variant/30 rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-200" placeholder="admin@gymx.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-[#1a1f35] border border-outline-variant/30 rounded-lg py-3 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:outline-none focus:border-primary transition-all duration-200" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center space-x-3 mb-2">
<input class="w-4 h-4 rounded border-outline-variant/30 bg-[#1a1f35] text-primary focus:ring-primary focus:ring-offset-0" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="remember">Keep me logged in for 30 days</label>
</div>
<button class="w-full primary-gradient text-on-primary-fixed font-headline-md text-[18px] py-4 rounded-xl shadow-[0_4px_15px_rgba(207,188,255,0.2)] hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Sign In
                </button>
</form>
<!-- Footer Muted Text -->
<div class="mt-8 pt-6 border-t border-outline-variant/10 text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-60 leading-relaxed">
                    Staff accounts are managed by the head office. Contact your administrator if you are unable to access your portal.
                </p>
</div>
</div>
<!-- External Links -->
<div class="mt-8 flex justify-center space-x-6 text-on-surface-variant font-label-sm text-label-sm">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Support</a>
</div>
</main>
<!-- Version Indicator -->
<div class="fixed bottom-gutter right-gutter">
<span class="font-label-sm text-label-sm text-outline-variant/50">GymX v2.4.0</span>
</div>
<!-- Background Imagery Decorative Component -->
<div class="absolute inset-0 -z-10 opacity-20">
